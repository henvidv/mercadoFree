<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Mercado Libre</title>
    <link rel="stylesheet" href="../scripts/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 style="cursor: pointer;" onclick="window.location.href='/'">🛒 Mercado Libre</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar productos..." onkeypress="handleSearchKeyPress(event)">
                <button class="btn-primary" onclick="searchProducts()">🔍</button>
            </div>
            <div class="nav-buttons" id="navButtons">
                <button class="btn-primary" onclick="window.location.href='/'">Iniciar Sesión</button>
                <button class="btn-secondary" onclick="window.location.href='/'">Registrarse</button>
                <button class="btn-secondary hidden" id="adminButton" onclick="window.location.href='admin.html'">⚙️ Admin</button>
            </div>
            <div class="user-info hidden" id="userInfo">
                <div class="user-avatar" id="userAvatar">U</div>
                <span id="userName">Usuario</span>
                <button class="btn-secondary" onclick="window.location.href='cart.html'">🛒 Carrito</button>
                <button class="btn-secondary hidden" id="adminButtonLoggedIn" onclick="window.location.href='admin.html'">⚙️ Admin</button>
                <button class="btn-secondary" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Cart Section -->
        <div class="card" id="cartSection">
            <h2>🛒 Carrito de Compras</h2>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal">Total: $0.00</div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn-secondary" onclick="window.location.href='/'">Seguir Comprando</button>
                <button class="btn-success" onclick="window.location.href='checkout.html'">Finalizar Compra</button>
            </div>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer"></div>
    </div>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/script.js"></script>
    <script src="../scripts/cart.js"></script>
    <script>
        // Renderizar carrito al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            renderCart();
            updateAuthUI();
        });
    </script>
</body>
</html>
